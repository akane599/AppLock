name: Build APK

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up JDK 17
        uses: actions/setup-java@v4.7.1
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Give permission to executable
        run: chmod +x gradlew

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3.2.2
        with:
          # Override the action's default, which includes the removed `tools` package.
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4.4.1

      - name: Test and lint
        run: >-
          ./gradlew :app:testDebugUnitTest :appintro:testDebugUnitTest lintDebug
          --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process

      - name: Build debug and release APKs
        run: >-
          ./gradlew :app:assembleDebug :app:assembleRelease
          --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process

      - name: Upload debug APK
        uses: actions/upload-artifact@v4.6.2
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release APK
        uses: actions/upload-artifact@v4.6.2
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
